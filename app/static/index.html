<!DOCTYPE html>
<html lang="en" class="h-full light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoClip AI – Long-to-Short Video Repurposing Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col transition-colors duration-200">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="#/" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                    <i data-lucide="scissors" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5">
                        AutoClip <span class="text-brand-600 font-extrabold">AI</span>
                    </span>
                    <span class="block text-[10px] uppercase tracking-wider font-semibold text-slate-400 -mt-1">Intelligent Repurposing</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center space-x-1">
                <a href="#/" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    Home
                </a>
                <a href="#/dashboard" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    Dashboard
                </a>
                <a href="#/projects/new" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    New Project
                </a>
            </nav>

            <!-- Actions & Theme Toggle -->
            <div class="flex items-center space-x-3">
                <a href="#/login" id="sign-in-link" class="text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-brand-600">Sign in</a>
                <button id="sign-out-button" class="hidden text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-brand-600">Sign out</button>
                <button id="theme-toggle" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Dark/Light Mode">
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>
                <a href="#/projects/new" class="inline-flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white shadow-sm shadow-brand-600/30 transition-all hover:shadow-brand-600/50">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Create Clips</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Application Container -->
    <main id="app-root" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Rendered dynamically by app.js -->
        <div class="flex items-center justify-center min-h-[50vh]">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-brand-500 border-t-transparent"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-500 text-xs py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <span class="font-semibold text-slate-700 dark:text-slate-300">AutoClip AI</span>
                <span>• One Video. Multiple Clips. Powered by AI.</span>
            </div>
            <div class="flex items-center space-x-6 text-slate-400">
                <span>Intelligent Analysis</span>
                <span>Explainable 8-Factor Scoring</span>
                <span>Automated 9:16 Editing</span>
            </div>
        </div>
    </footer>

    <!-- App Scripts -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
