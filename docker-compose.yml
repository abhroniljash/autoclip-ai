services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoclip
      POSTGRES_USER: autoclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoclip -d autoclip"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://autoclip:${POSTGRES_PASSWORD}@db:5432/autoclip
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1000}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      S3_BUCKET: ${S3_BUCKET:-}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - autoclip_storage:/app/storage
      - ~/.aws:/home/appuser/.aws:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  worker:
    build: .
    command: ["python", "worker.py"]
    profiles: ["aws"]
    environment:
      DATABASE_URL: postgresql+psycopg://autoclip:${POSTGRES_PASSWORD}@db:5432/autoclip
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET to a private bucket}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:?Set SQS_QUEUE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - autoclip_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  autoclip_storage:
